[tool.poetry]
name = "api-service-for-working-with-user-wallets"
version = "0.0.1"
description = "Allows you to write off and return money, and also get a balance"
authors = ["Sladkiy-bubalex <shadow.ru_93@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13"
uvicorn = "0.38.0"
sqlalchemy = "2.0.44"
python-dotenv = "1.1.1"
pyjwt = "2.10.1"
pydantic-settings = "2.11.0"
fastapi = "0.119.0"
asyncpg = "0.30.0"
alembic = "1.17.0"
passlib = "^1.7.4"
redis = "^7.0.0"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
